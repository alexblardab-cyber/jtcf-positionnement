function normaliserTexte(s){
  return String(s||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')   // accents
    .replace(/[^a-z0-9 ]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

// Recalcule le score QCM à partir du texte brut des réponses
function scoreQCMDepuisReponses(texte){
  var lignes = String(texte||'').split('\n');
  var total = 0, bons = 0, reconnues = 0;
  for (var i = 0; i < lignes.length; i++){
    if (lignes[i].indexOf('[QCM]') < 0) continue;
    var q = lignes[i].replace(/^Q\d+\s*\[QCM\]\s*:\s*/, '').trim();
    var bonne = CORRIGE_QCM[q];
    if (bonne === undefined) continue;        // question hors corrigé
    reconnues++;
    total++;
    var rep = (lignes[i+1] || '').replace('\u2192','').trim();
    if (!rep || rep === '(Sans réponse)') continue;
    if (normaliserTexte(rep) === normaliserTexte(bonne)) bons++;
  }
  if (reconnues === 0) return null;
  return { score: bons, total: total, pct: Math.round(bons / total * 100) };
}

// ══════════════════════════════════════════════════════════════
//  NORMALISATION — répare les lignes dont les colonnes sont décalées
//  Le champ "reponses" contient un en-tête écrit par le formulaire :
//    FORMATION : … / CANDIDAT : … / DATE : … / DDN / TEL / EMAIL / NIVEAU
//  Il ne dépend d'aucune colonne : c'est notre source de vérité.
// ══════════════════════════════════════════════════════════════
function champEntete(txt, cle){
  if(!txt) return '';
  var m = txt.match(new RegExp('^\\s*'+cle+'\\s*:\\s*(.+)$','mi'));
  if(!m) return '';
  var v = m[1].trim();
  if(/^non renseign/i.test(v)) return '';
  return v;
}

// Une valeur qui ressemble à une date ISO ou à l'époque Excel n'est pas un intitulé
function ressembleADate(v){
  return typeof v === 'string' && (/^\d{4}-\d{2}-\d{2}T/.test(v) || /^1899-12-30/.test(v));
}

function normaliserResultat(r){
  var txt = r.reponses || '';
  var o = Object.assign({}, r);

  var fFormation = champEntete(txt, 'FORMATION');
  var fCandidat  = champEntete(txt, 'CANDIDAT');
  var fDate      = champEntete(txt, 'DATE');
  var fDdn       = champEntete(txt, 'DDN');
  var fTel       = champEntete(txt, 'TEL');
  var fEmail     = champEntete(txt, 'EMAIL');
  var fNiveau    = champEntete(txt, 'NIVEAU');

  if (fFormation) o.formation = fFormation;
  else if (ressembleADate(o.formation) && o.nom) { o.formation = o.nom; o.nom = ''; }

  if (fCandidat){
    var parts = fCandidat.split(/\s+/);
    o.prenom = parts.shift() || '';
    o.nom    = parts.join(' ');
    if(!o.nom){ o.nom = o.prenom; o.prenom = ''; }   // un seul mot fourni
  }

  if (fDate)   o.date   = fDate;
  if (fDdn)    o.ddn    = fDdn;
  if (fTel)    o.tel    = fTel;
  if (fEmail)  o.email  = fEmail;
  if (fNiveau) o.niveau = fNiveau;

  // Score QCM : recalculé depuis le texte si la feuille n'en contient pas,
  // ou si la valeur enregistrée est une estimation par mots-clés (0/10 douteux)
  var sc = scoreQCMDepuisReponses(txt);
  if (sc && (!o.scoreQCM || String(o.scoreQCM).indexOf('/') < 0 || sc.score > 0)) {
    o.scoreQCM = sc.score + '/' + sc.total;
    o.scorePct = sc.pct + '%';
    o.scoreRecalcule = true;
  }

  // Une date ISO résiduelle est reformatée en jj/mm/aaaa
  if (ressembleADate(o.date)){
    var d = new Date(o.date);
    if(!isNaN(d)) o.date = ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
  }
  // L'heure éventuellement piégée dans un champ texte
  if (ressembleADate(o.heure)){
    var hh = new Date(o.heure);
    if(!isNaN(hh)) o.heure = ('0'+hh.getHours()).slice(-2)+':'+('0'+hh.getMinutes()).slice(-2);
  }
  return o;
}

function normaliserTout(liste){
  var repares = 0;
  var out = (liste||[]).map(function(r){
    var n = normaliserResultat(r);
    if (n.formation !== r.formation || n.nom !== r.nom || n.prenom !== r.prenom) repares++;
    return n;
  });
  if (repares > 0) console.info('[JTCF] ' + repares + ' résultat(s) réalignés depuis l\'en-tête des réponses.');
  return out;
}

// ── CHARGEMENT ────────────────────────────────────────────────
async function chargerResultats() {
  try {
    const url = SCRIPT_URL + '?action=list&code=' + encodeURIComponent(CODE_ACCES);
    const r = await fetch(url);
    const data = await r.json();
    if (data.status === 'ERREUR') {
      document.getElementById('loginErr').style.display = 'block';
      return;
    }
    document.getElementById('screenLogin').style.display = 'none';
    document.getElementById('screenAdmin').style.display = 'block';
    tousResultats = normaliserTout(data.resultats || []);
    peuplerFiltreFormation();
    filtrer();
  } catch(e) {
    // Si Apps Script pas encore redéployé, utiliser données démo
    document.getElementById('screenLogin').style.display = 'none';
    document.getElementById('screenAdmin').style.display = 'block';
    tousResultats = normaliserTout(donneesDEMO());
    peuplerFiltreFormation();
    filtrer();
  }
}

function peuplerFiltreFormation() {
  const sel = document.getElementById('filtreFormation');
  const formations = [...new Set(tousResultats.map(r => r.formation))].sort();
  formations.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f; opt.textContent = f;
    sel.appendChild(opt);
  });
}

function filtrer() {
  const form = document.getElementById('filtreFormation').value;
  const jours = parseInt(document.getElementById('filtrePeriode').value) || 0;
  resultatsAffiches = tousResultats.filter(r => {
    if (form && r.formation !== form) return false;
    if (jours) {
      const d = parseDate(r.date);
      if (!d) return true;
      return (Date.now() - d.getTime()) < jours * 86400000;
    }
    return true;
  });
  afficherListe();
}

function parseDate(str) {
  if (!str) return null;
  const p = str.split('/');
  if (p.length === 3) return new Date(p[2], p[1]-1, p[0]);
  return new Date(str);
}

// ── AFFICHAGE LISTE ───────────────────────────────────────────
function scoreClass(pct) {
  const n = parseInt(pct) || 0;
  if (n >= 70) return 'score-vert';
  if (n >= 40) return 'score-orange';
  return 'score-rouge';
}
function recoClass(reco) {
  if (!reco) return '';
  if (reco.includes('Très favorable')) return 'reco-favorable';
  if (reco.includes('approfondir')) return 'reco-approfondir';
  return 'reco-inadapte';
}
function initiales(nom, prenom) {
  return ((prenom||'')[0]||'') + ((nom||'')[0]||'');
}

function afficherListe() {
  const container = document.getElementById('listeCandidats');
  document.getElementById('badgeCount').textContent = resultatsAffiches.length + ' candidat(s)';

  // Stats rapides basées sur score QCM
  let fav=0, app=0, ina=0, nonEval=0;
  resultatsAffiches.forEach(r => {
    if (!r.scoreQCM || !r.scorePct) { nonEval++; return; }   // aucune donnée de QCM
    const pct = parseInt(r.scorePct) || 0;
    if (pct >= 70) fav++;
    else if (pct >= 40) app++;
    else ina++;
  });
  document.getElementById('statTotal').textContent = resultatsAffiches.length;
  document.getElementById('statFavorables').textContent = fav;
  document.getElementById('statApprofondir').textContent = app;
  document.getElementById('statInadaptes').textContent = ina;

  if (!resultatsAffiches.length) {
    container.innerHTML = '<div class="empty-state"><div class="emoji">📭</div><div>Aucun résultat pour ces critères</div></div>';
    return;
  }

  container.innerHTML = '';
  resultatsAffiches.forEach(r => {
    const pct = r.scorePct || '—';
    const sc = scoreClass(r.scorePct);
    const ini = initiales(r.nom, r.prenom).toUpperCase();
    const card = document.createElement('div');
    card.className = 'candidat-card';
    card.onclick = () => ouvrirModal(r);
    card.innerHTML = `
      ${r.scoreQCM ? `<div class="score-badge ${sc}">${r.scoreQCM} · ${pct}</div>`
                   : `<div class="score-badge" style="background:#EDF2F7;color:#4A5568;">QCM non évalué</div>`}
      <div class="candidat-header">
        <div class="candidat-avatar">${ini}</div>
        <div>
          <div class="candidat-nom">${((r.prenom||'')+' '+(r.nom||'')).trim() || '— Nom non renseigné —'}</div>
          <div class="candidat-form">${r.formation}</div>
          <div class="candidat-date">📅 ${r.date} ${r.heure ? '· '+r.heure : ''}</div>
        </div>
      </div>
      <div class="candidat-reco loading-ia" id="reco-${r.id}">Cliquer pour voir l'analyse IA →</div>`;
    container.appendChild(card);
  });
}

// ── MODAL ─────────────────────────────────────────────────────
async function ouvrirModal(r) {
  candidatCourant = r;
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalTitre').textContent = r.prenom + ' ' + r.nom;
  document.getElementById('modalSous').textContent = r.formation + ' · ' + r.date;

  // Infos
  document.getElementById('modalInfos').innerHTML = `
    <div class="info-item"><div class="info-lbl">Date de naissance</div><div class="info-val">${r.ddn||'—'}</div></div>
    <div class="info-item"><div class="info-lbl">Téléphone</div><div class="info-val">${r.tel||'—'}</div></div>
    <div class="info-item"><div class="info-lbl">Email</div><div class="info-val">${r.email||'—'}</div></div>
    <div class="info-item"><div class="info-lbl">Niveau</div><div class="info-val">${r.niveau||'—'}</div></div>
    <div class="info-item"><div class="info-lbl">Score QCM</div><div class="info-val">${r.scoreQCM||'—'} (${r.scorePct||'—'})</div></div>
    <div class="info-item"><div class="info-lbl">Formation visée</div><div class="info-val">${r.formation}</div></div>`;

  // Radar
  dessinerRadar(r);

  // Analyse IA
  document.getElementById('analyseIA').innerHTML = '<span class="analyse-loading">Analyse IA en cours…</span>';
  const analyse = await analyserAvecIA(r);
  document.getElementById('analyseIA').innerHTML = analyse.html;

  // Mettre à jour la carte dans la liste
  const recoEl = document.getElementById('reco-' + r.id);
  if (recoEl) {
    recoEl.className = 'candidat-reco ' + recoClass(analyse.reco);
    recoEl.textContent = analyse.reco || 'Analyse effectuée';
  }

  // Réponses
  afficherReponses(r);
}

function fermerModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  candidatCourant = null;
}

// ── RADAR ─────────────────────────────────────────────────────
function dessinerRadar(r) {
  const pct = parseInt(r.scorePct) || 0;
  const texte = r.reponses || '';
  // Estimation heuristique des axes à partir du texte et score
  const nMots = texte.split(' ').length;
  const connaissances = Math.min(100, pct);
  const communication = Math.min(100, nMots > 300 ? 75 : nMots > 150 ? 55 : 35);
  const logique = Math.min(100, pct * 1.1);
  const motivation = texte.toLowerCase().includes('passion') || texte.toLowerCase().includes('souhait') ? 80 : 60;
  const posture = texte.length > 200 ? 70 : 45;

  if (radarInstance) radarInstance.destroy();
  const ctx = document.getElementById('radarChart').getContext('2d');
  radarInstance = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: ['Connaissances\nmétier', 'Communication', 'Logique /\ncalcul', 'Motivation', 'Posture\nprofessionnelle'],
      datasets: [{
        data: [connaissances, communication, logique, motivation, posture],
        backgroundColor: 'rgba(201,162,39,0.15)',
        borderColor: '#C9A227',
        borderWidth: 2,
        pointBackgroundColor: '#C9A227',
        pointRadius: 4,
      }]
    },
    options: {
      scales: { r: { min:0, max:100, ticks: { display: false }, pointLabels: { font: { size: 11 } } } },
      plugins: { legend: { display: false } },
      responsive: true,
    }
  });
}

// ── ANALYSE IA ────────────────────────────────────────────────
async function analyserAvecIA(r) {
  // L'analyse est réalisée par le script Google : la clé API y reste stockée,
  // elle n'apparaît jamais dans cette page.
  try {
    const url = SCRIPT_URL + '?action=analyse&code=' + encodeURIComponent(CODE_ACCES)
              + '&id=' + encodeURIComponent(r.id);
    const resp = await fetch(url);
    const data = await resp.json();

    if (data.status !== 'OK' || !data.analyse) {
      const msg = data.message || 'Réponse inattendue du serveur.';
      return {
        html: '<em>Analyse automatique indisponible.</em><br><br>' + msg,
        reco: (r.scoreQCM && r.scorePct)
          ? (parseInt(r.scorePct) >= 70 ? '✅ Très favorable'
             : parseInt(r.scorePct) >= 40 ? '⚠️ À approfondir' : '⚠️ Score QCM faible')
          : '📄 Voir les réponses'
      };
    }

    const texteIA = data.analyse;
    let reco = '—';
    const t = texteIA.toLowerCase();
    if (t.indexOf('très favorable') >= 0 || t.indexOf('tres favorable') >= 0) reco = '✅ Très favorable';
    else if (t.indexOf('à approfondir') >= 0 || t.indexOf('a approfondir') >= 0) reco = '⚠️ À approfondir';
    else if (t.indexOf('inadapt') >= 0) reco = '❌ Inadapté(e)';

    // Mise en forme : gras, titres de section et listes à puces
    const html = texteIA
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/^\s*[\*\-]\s+/gm, '• ')
      .replace(/^(\d\.\s*[A-ZÀ-Ÿ][^\n]*)$/gm,
               '<div style="font-weight:800;color:#2A4365;margin:14px 0 6px;">$1</div>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');

    return { html: '<p>' + html + '</p>', reco };

  } catch(e) {
    return {
      html: '<em>Analyse automatique indisponible.</em><br><br>Le service n\'a pas pu être joint.',
      reco: (r.scoreQCM && r.scorePct)
        ? (parseInt(r.scorePct) >= 70 ? '✅ Très favorable'
           : parseInt(r.scorePct) >= 40 ? '⚠️ À approfondir' : '⚠️ Score QCM faible')
        : '📄 Voir les réponses'
    };
  }
}

// ── RÉPONSES ──────────────────────────────────────────────────
function afficherReponses(r) {
  const container = document.getElementById('modalReponses');
  const texte = r.reponses || '';
  const lignes = texte.split('\n');
  let html = '';
  let questionCourante = '';
  for (const ligne of lignes) {
    if (ligne.startsWith('Q') && ligne.includes('[') && ligne.includes(']')) {
      questionCourante = ligne;
    } else if (ligne.startsWith('→') && questionCourante) {
      const typeMatch = questionCourante.match(/\[(\w+)\]/);
      const type = typeMatch ? typeMatch[1] : '';
      if (type === 'SITUATION' || type === 'OPEN' || type === 'CALCUL') {
        html += `<div class="reponse-item">
          <div class="reponse-q">${questionCourante.replace(/Q\d+ \[\w+\] : /, '')}</div>
          <div class="reponse-r">${ligne.replace('→','').trim() || '<em>Sans réponse</em>'}</div>
        </div>`;
      }
    }
  }
  container.innerHTML = html || '<div style="color:var(--gris);font-size:13px;">Réponses disponibles dans le texte brut ci-dessus.</div>';
}
